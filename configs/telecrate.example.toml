# TeleCrate — config mẫu (copy sang /etc/telecrate/telecrate.toml rồi sửa, quyền 0600 vì chứa secrets)
db_path = "/var/lib/telecrate/index.db"
spool_dir = "/var/lib/telecrate/spool"
listen_port = 7070
# Mã hóa nội dung OPTIONAL: "off" | "on". Chỉ áp dụng ghi mới; dữ liệu cũ giữ chế độ cũ.
# "off" nghĩa là nội dung có thể đọc được tại nơi lưu nếu nguồn chưa mã hóa.
encryption = "off"
# SigV4 auto-region: mọi region trong credential scope đều được chấp nhận.
# Access keys S3 (M2: danh sách tĩnh; phân quyền prefix ở M4). Đặt secret thật khi triển khai.
[[access_keys]]
access_key_id = "TELECRATE-EXAMPLE-KEY"
secret_key = "thay-secret-that-o-day"
# Telegram worker (M2.2+): bot token + chat id nhận blob. Để trống/0 = worker idle.
# Token chỉ nằm ở file này (0600) và Actions Secrets khi test — không commit secret thật.
telegram_bot_token = ""
telegram_chat_id = 0
# Chunk upload Telegram (256 KiB..16 MiB, mặc định 8 MiB) + số worker đồng thời (1..8).
# chunk_size_bytes = 8388608
# worker_concurrency = 2
# Mã hóa nội dung: đặt encryption = "on" + ít nhất một key (file 32 bytes thô, 0600).
# Đổi content_key_id = rotation cho ghi mới; giữ key cũ trong list để đọc dữ liệu cũ.
# encryption = "on"
# [[content_keys]]
# id = "k1"
# file = "/etc/telecrate/content-k1.key"

# Logging: muc log trace|debug|info|warn|error; file daily-rotation (gi stdout cho journald)
# log_level = "info"
# log_to_file = false
# log_dir = "/var/lib/telecrate/logs"
# log_retention_days = 14
