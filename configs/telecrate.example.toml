# TeleCrate — config mẫu (copy sang /etc/telecrate/telecrate.toml rồi sửa, quyền 0600 vì chứa secrets)
db_path = "/var/lib/telecrate/index.db"
spool_dir = "/var/lib/telecrate/spool"
listen_port = 7070
# Mã hóa nội dung OPTIONAL: "off" | "on". Chỉ áp dụng ghi mới; dữ liệu cũ giữ chế độ cũ.
# "off" nghĩa là nội dung có thể đọc được tại nơi lưu nếu nguồn chưa mã hóa.
encryption = "off"
# Region cho SigV4 scope (ví dụ "telecrate-1"). Client ký với region này.
region = "telecrate-1"
# Access keys S3 (M2: danh sách tĩnh; phân quyền prefix ở M4). Đặt secret thật khi triển khai.
[[access_keys]]
access_key_id = "TELECRATE-EXAMPLE-KEY"
secret_key = "thay-secret-that-o-day"
