name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: cargo test
      - name: validate sample config + systemd unit
        run: |
          test -f configs/telecrate.example.toml
          test -f packaging/systemd/telecrate.service
          grep -q "ExecStart=" packaging/systemd/telecrate.service
