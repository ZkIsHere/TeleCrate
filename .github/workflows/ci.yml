name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
      - name: validate sample config + systemd unit
        run: |
          test -f packaging/telecrate.sample.toml
          test -f packaging/telecrate.service
          grep -q "ExecStart=" packaging/telecrate.service

  # Live Telegram probe — job RIÊNG, tách khỏi PR checks.
  # Chỉ chạy khi repo có secrets; thiếu secrets → skip = unverified, không giả live pass.
  # Secrets bị GitHub mask trong log; test không in token/locator (xem telegram.rs).
  live-telegram:
    runs-on: [self-hosted, Linux, X64]
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: live telegram probe (ignored test)
        env:
          TELECRATE_BOT_TOKEN: ${{ secrets.TELECRATE_BOT_TOKEN }}
          TELECRATE_TEST_CHAT_ID: ${{ secrets.TELECRATE_TEST_CHAT_ID }}
        run: |
          if [ -z "$TELECRATE_BOT_TOKEN" ] || [ -z "$TELECRATE_TEST_CHAT_ID" ]; then
            echo "live-telegram: UNVERIFIED (thiếu secrets) — không giả live pass"
            exit 0
          fi
          cargo test -- --ignored live_

  # Website smoke: daemon thật + curl kiểm assets/auth/API shapes (không cần browser).
  website:
    runs-on: [self-hosted, Linux, X64]
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - run: bash tests/website.sh

  # S3 conformance bằng AWS CLI thật (STRICT: thiếu aws là fail).
  awscli-conformance:
    runs-on: [self-hosted, Linux, X64]
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: cài AWS CLI / rclone / mc nếu thiếu
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y awscli
            elif command -v pip3 >/dev/null 2>&1; then
              pip3 install --user awscli
            else
              cd /tmp
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
              (command -v unzip >/dev/null || (command -v apt-get >/dev/null && apt-get install -y unzip))
              unzip -q -o awscliv2.zip
              ./aws/install
            fi
          fi
          if ! command -v rclone >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get install -y rclone || true
            fi
            if ! command -v rclone >/dev/null 2>&1; then
              curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
              unzip -q -o /tmp/rclone.zip -d /tmp
              cp /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/
              chmod +x /usr/local/bin/rclone
            fi
          fi
          if ! command -v mc >/dev/null 2>&1; then
            # dl.min.io cũ đã 410; thử host mới, thất bại thì bỏ qua (mc tùy chọn).
            curl -fsSL https://dl.minio.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc 2>/dev/null \
              || curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc 2>/dev/null \
              || echo "mc install skipped (optional)"
            chmod +x /usr/local/bin/mc 2>/dev/null || true
          fi
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          command -v aws && aws --version
          command -v rclone && rclone version | head -1
          command -v mc && mc --version || echo "mc optional, skipped"
      - name: dựng daemon tạm + chạy conformance
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          WORK="$(mktemp -d)"
          cat > "$WORK/telecrate.toml" <<EOF
          db_path = "$WORK/index.db"
          spool_dir = "$WORK/spool"
          listen_port = 18081
          encryption = "off"
          admin_password = "ci-test"
          [[access_keys]]
          access_key_id = "AKIAEXAMPLE12345"
          secret_key = "secret1234567890secret1234567890"
          EOF
          ./target/debug/telecrate --config "$WORK/telecrate.toml" init
          ./target/debug/telecrate --config "$WORK/telecrate.toml" serve &>/tmp/tc-ci.log &
          DAEMON=$!
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1 && break
            sleep 0.2
          done
          export ENDPOINT="http://127.0.0.1:18081"
          export STRICT=1
          bash tests/conformance.sh
          kill "$DAEMON"
          rm -rf "$WORK"
