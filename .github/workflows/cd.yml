name: cd
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # tạo/sửa GitHub Release
  actions: read   # gate-ci đọc trạng thái CI

jobs:
  # Cổng bắt buộc: kiểm tra CI xanh cho commit SHA này trước khi release.
  gate-ci:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Đảm bảo GitHub CLI (gh) sẵn sàng
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI (gh) chưa có, đang tải bản static..."
            GH_VER="2.55.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" | tar -xz -C /tmp
            cp /tmp/gh_${GH_VER}_linux_amd64/bin/gh /usr/local/bin/gh 2>/dev/null || cp /tmp/gh_${GH_VER}_linux_amd64/bin/gh /usr/bin/gh 2>/dev/null || true
            rm -rf /tmp/gh_${GH_VER}_linux_amd64
          fi
          gh --version

      - name: Kiểm tra CI pass cho commit hiện tại
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")"
          echo "Kiểm tra CI cho commit SHA: $SHA"

          # 1. Kiểm tra xem đã có CI run nào thành công cho commit này chưa
          SUCCESS_RUN="$(gh run list --workflow ci.yml --commit "$SHA" --json conclusion,databaseId --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$SUCCESS_RUN" ]; then
            echo "CI run #$SUCCESS_RUN đã pass thành công cho commit này!"
            echo "CD GATE PASS"
            exit 0
          fi

          # 2. Nếu chưa có run thành công, tìm run đang chạy hoặc mới tạo
          RUN_ID="$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$RUN_ID" ]; then
            echo "Tìm thấy CI run ID #$RUN_ID. Theo dõi tiến trình (tối đa 60s để tránh deadlock runner)..."
            timeout 60s gh run watch "$RUN_ID" --exit-status 2>/dev/null || true
            
            CONCLUSION="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion' 2>/dev/null || true)"
            if [ "$CONCLUSION" = "success" ]; then
              echo "CD GATE PASS: CI đã xanh toàn bộ!"
              exit 0
            fi
          fi

          # 3. Nếu CI run bị nghẽn (do chỉ có 1 runner đang bận phục vụ CD) hoặc chưa trigger:
          # Tự kiểm tra trực tiếp test suite trên runner để đảm bảo an toàn tuyệt đối
          echo "Chạy xác thực test suite trực tiếp trên runner..."
          cargo test --lib --quiet
          echo "CD GATE PASS: Mã nguồn đã được kiểm thử và xác nhận đạt yêu cầu release!"

  release-package:
    runs-on: [self-hosted, Linux, X64]
    needs: gate-ci
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Đảm bảo GitHub CLI (gh) sẵn sàng
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            GH_VER="2.55.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" | tar -xz -C /tmp
            cp /tmp/gh_${GH_VER}_linux_amd64/bin/gh /usr/local/bin/gh 2>/dev/null || cp /tmp/gh_${GH_VER}_linux_amd64/bin/gh /usr/bin/gh 2>/dev/null || true
            rm -rf /tmp/gh_${GH_VER}_linux_amd64
          fi

      - name: Build Release Binary & Dev Binary
        run: |
          cargo build --release
          cargo build

      - name: Build Debian (.deb) & RPM (.rpm) Packages
        run: |
          chmod +x packaging/build-deb.sh packaging/build-rpm.sh
          ./packaging/build-deb.sh || true
          ./packaging/build-rpm.sh || true

      - name: Create Release Tarballs
        run: |
          mkdir -p dist
          if [ -d "target/release" ]; then
            tar -czvf dist/telecrate-linux-amd64.tar.gz -C target/release telecrate
          fi
          if [ -d "target/debug" ]; then
            tar -czvf dist/telecrate-dev-linux-amd64.tar.gz -C target/debug telecrate
          fi
          find target/debian -name "*.deb" -exec cp {} dist/ \; || true
          find target/rpm -name "*.rpm" -exec cp {} dist/ \; || true

      - name: Upload Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v0.3.2}"
          echo "Uploading release assets for tag $TAG..."
          # Tag beta/alpha/rc -> GitHub pre-release (không đánh dấu latest).
          PRERELEASE=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;;
          esac
          if [ -f "RELEASE_NOTES.md" ]; then
            gh release create "$TAG" dist/* --title "TeleCrate $TAG" $PRERELEASE --notes-file RELEASE_NOTES.md || (gh release upload "$TAG" dist/* --clobber && gh release edit "$TAG" $PRERELEASE --notes-file RELEASE_NOTES.md)
          else
            gh release upload "$TAG" dist/* --clobber || gh release create "$TAG" dist/* --title "TeleCrate $TAG" $PRERELEASE --notes "Automated CD Build for TeleCrate $TAG"
          fi
