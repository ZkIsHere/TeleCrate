name: cd
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # tạo/sửa GitHub Release
  actions: read # gate-ci đọc trạng thái CI

jobs:
  # Cổng bắt buộc: chỉ release khi CI của đúng SHA đã pass toàn bộ (backend + website + awscli).
  # live-telegram được miễn (cần secrets, có thể UNVERIFIED) — release notes ghi rõ.
  gate-ci:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: kiểm tra CI pass cho commit hiện tại
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")"
          echo "Kiểm tra CI cho SHA: $SHA"
          PASS=true
          for JOB in backend website awscli-conformance; do
            STATUS="$(gh run list --workflow ci.yml --commit "$SHA" --limit 5 --json conclusion,name \
              --jq "[.[] | select(.name==\"$JOB\")][0].conclusion // \"missing\"")"
            echo "- $JOB: $STATUS"
            if [ "$STATUS" != "success" ]; then PASS=false; fi
          done
          if [ "$PASS" != "true" ]; then
            echo "CD BLOCKED: CI chưa xanh cho SHA này — không release" >&2
            exit 1
          fi
          echo "CD GATE PASS"

  release-package:
    runs-on: [self-hosted, Linux, X64]
    needs: gate-ci
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: telecrate-ci

      - name: Build Release Binary & Dev Binary
        run: |
          cargo build --release
          cargo build

      - name: Build Debian (.deb) & RPM (.rpm) Packages
        run: |
          chmod +x packaging/build-deb.sh packaging/build-rpm.sh
          ./packaging/build-deb.sh || true
          ./packaging/build-rpm.sh || true

      - name: Create Release Tarballs
        run: |
          mkdir -p dist
          if [ -d "target/release" ]; then
            tar -czvf dist/telecrate-linux-amd64.tar.gz -C target/release telecrate
          fi
          if [ -d "target/debug" ]; then
            tar -czvf dist/telecrate-dev-linux-amd64.tar.gz -C target/debug telecrate
          fi
          find target/debian -name "*.deb" -exec cp {} dist/ \; || true
          find target/rpm -name "*.rpm" -exec cp {} dist/ \; || true

      - name: Upload Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          echo "Uploading release assets for tag $TAG..."
          gh release upload "$TAG" dist/* --clobber || gh release create "$TAG" dist/* --title "TeleCrate $TAG" --notes "Automated CD Build for TeleCrate $TAG"
