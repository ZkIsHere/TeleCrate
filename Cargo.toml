[package]
name = "telecrate"
version = "0.1.0"
edition = "2021"
description = "TeleCrate — S3-compatible object storage backed by Telegram (single instance, systemd-native)"
license = "MIT"

[[bin]]
name = "telecrate"
path = "src/main.rs"

[lib]
name = "telecrate"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
# HTTP client cho Telegram Bot API. rustls-tls-webpki-roots = TLS thuần Rust,
# không phụ thuộc OpenSSL hệ thống trên runner.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-webpki-roots"] }
# SigV4 (HMAC-SHA256) + XML S3 (error/response) + MD5 ETag single-part.
hmac = "0.12"
md5 = "0.7"
quick-xml = { version = "0.37", features = ["serialize"] }
# Mã hóa nội dung: ChaCha20-Poly1305 thuần Rust + CSPRNG đa nền tảng.
chacha20poly1305 = "0.10"
getrandom = "0.2"
tempfile = "3"

[dev-dependencies]
