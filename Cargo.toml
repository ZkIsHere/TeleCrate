[package]
name = "telecrate"
version = "0.3.3-beta.7"
edition = "2021"
description = "TeleCrate — S3-compatible object storage backed by Telegram (single instance, systemd-native)"
license = "MIT"

[[bin]]
name = "telecrate"
path = "src/main.rs"

[lib]
name = "telecrate"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "std"] }
# Log file daily-rotation cho daemon (stdout vẫn giữ cho journald).
tracing-appender = "0.2"
# rusqlite 0.32 (libsqlite3-sys 0.30) để chung native lib với sqlx-sqlite 0.8
# (0.31 kéo libsqlite3-sys 0.28 → cargo báo xung đột `links = "sqlite3"`).
# Chỉ dùng cho: mở file DB trực tiếp trong tests + giữ feature backup.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
# HTTP client cho Telegram Bot API. rustls-tls-webpki-roots = TLS thuần Rust,
# không phụ thuộc OpenSSL hệ thống trên runner.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-webpki-roots"] }
# SigV4 (HMAC-SHA256) + XML S3 (error/response) + MD5 ETag single-part.
hmac = "0.12"
md5 = "0.7"
quick-xml = { version = "0.37", features = ["serialize"] }
# Mã hóa nội dung: ChaCha20-Poly1305 thuần Rust + CSPRNG đa nền tảng.
chacha20poly1305 = "0.10"
getrandom = "0.2"
tempfile = "3"
# TLS native (HTTPS serve + self-signed gen + parse): thuần Rust, không OpenSSL hệ thống.
axum-server = { version = "0.7", features = ["tls-rustls"] }
# CryptoProvider cho rustls: cả axum-server và reqwest đều dùng bản no-provider,
# nên daemon phải install_default(ring) ở startup (tránh panic khi handshake).
rustls = { version = "0.23", features = ["ring"] }
# rcgen backend ring (chỉ cần cc như rusqlite bundled; tránh aws-lc-sys đòi cmake trên runner).
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
x509-parser = "0.16"
# DAL hợp nhất SQLite + Postgres: viết query `?` + bind một lần, sqlx tự
# rebind `$N` cho Postgres. Không dùng sqlx macros (cần DATABASE_URL lúc compile).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "runtime-tokio-rustls"] }
# ADR 0006: SeaORM 1.x (sqlx 0.8) + SeaQuery — entities là single source of truth
# cho cấu trúc bảng, mirror migrations SQL (không thay migrator). Entities viết
# tay để build offline; datetime TEXT map sang String (zero behavior change).
sea-orm = { version = "1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
# SeaQuery trực tiếp: build/đối chiếu DDL trong test parity + query tường minh ở phase sau.
sea-query = "0.32"

[dev-dependencies]
