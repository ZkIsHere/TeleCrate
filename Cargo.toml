[package]
name = "telecrate"
version = "0.1.0"
edition = "2021"
description = "TeleCrate — S3-compatible object storage backed by Telegram (single instance, systemd-native)"
license = "MIT"

[[bin]]
name = "telecrate"
path = "src/main.rs"

[lib]
name = "telecrate"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
